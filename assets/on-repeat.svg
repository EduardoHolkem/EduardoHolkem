<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-label="No repeat, Lilacs de Pastel Ghost">
  <defs>
    <linearGradient id="cv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3fb4"/><stop offset=".35" stop-color="#9b5cff"/><stop offset=".7" stop-color="#2e6bff"/><stop offset="1" stop-color="#2ff3e0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3fb4"/><stop offset=".35" stop-color="#9b5cff"/><stop offset=".7" stop-color="#2e6bff"/><stop offset="1" stop-color="#2ff3e0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="card"><rect width="480" height="150" rx="18"/></clipPath>
    <clipPath id="cover"><rect x="20" y="20" width="110" height="110" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="480" height="150" fill="#0d0718"/>
    <g filter="url(#blur)" opacity=".55">
      <circle cx="60" cy="40" r="70" fill="#ff3fb4"/><circle cx="460" cy="140" r="80" fill="#2ff3e0"/><circle cx="300" cy="10" r="60" fill="#9b5cff"/>
    </g>
    <rect x="22" y="22" width="106" height="106" rx="14" fill="#9b5cff" filter="url(#glow)" opacity=".7"><animate attributeName="opacity" values=".4;.85;.4" dur="3s" repeatCount="indefinite"/></rect>
    <g clip-path="url(#cover)">
      <rect x="20" y="20" width="110" height="110" fill="url(#cv)"/>
      <circle cx="75" cy="75" r="34" fill="#0d0718" opacity=".55"/>
      <circle cx="75" cy="75" r="6" fill="#ffffff" opacity=".85"/>
      <rect x="20" y="20" width="110" height="110" fill="url(#cv)" opacity=".15"><animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="8s" repeatCount="indefinite"/></rect>
    </g>
    <text x="150" y="44" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#c9b8ff" opacity=".8">NO REPEAT ENQUANTO PROGRAMO</text>
    <text x="150" y="76" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Lilacs</text>
    <text x="150" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#efe6ff" opacity=".75">Pastel Ghost</text>
    <rect x="150" y="114" width="250" height="4" rx="2" fill="#ffffff" opacity=".14"/>
    <rect x="150" y="114" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;250" dur="20s" repeatCount="indefinite"/></rect>
    <g fill="#2ff3e0" transform="translate(420 92)">
      <rect x="0" width="4" rx="2" y="10" height="10"><animate attributeName="height" values="4;22;4" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="18;0;18" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="8" width="4" rx="2" y="0" height="22"><animate attributeName="height" values="22;6;22" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="0;16;0" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="16" width="4" rx="2" y="6" height="16"><animate attributeName="height" values="8;22;8" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="14;0;14" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="24" width="4" rx="2" y="12" height="10"><animate attributeName="height" values="14;4;14" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="8;18;8" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <rect x=".5" y=".5" width="479" height="149" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  </g>
</svg>
