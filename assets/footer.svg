<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Tocando agora, Lilacs de Pastel Ghost">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="75"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#05000f" stop-opacity="0"/><stop offset="100%" stop-color="#05000f" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="four" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3fb4"/><stop offset=".35" stop-color="#9b5cff"/><stop offset=".7" stop-color="#2e6bff"/><stop offset="1" stop-color="#2ff3e0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3fb4"/><stop offset=".35" stop-color="#9b5cff"/><stop offset=".7" stop-color="#2e6bff"/><stop offset="1" stop-color="#2ff3e0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="280" rx="22"/></clipPath>
    <clipPath id="cover"><rect x="360" y="70" width="120" height="120" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="#07030f"/>
    <g filter="url(#blur)" opacity=".8">
      <circle r="180" fill="#2ff3e0" cx="160" cy="220"><animate attributeName="cx" values="160;380;160" dur="15s" repeatCount="indefinite"/><animate attributeName="cy" values="220;60;220" dur="12s" repeatCount="indefinite"/></circle>
      <circle r="190" fill="#2e6bff" cx="480" cy="10"><animate attributeName="cx" values="480;300;480" dur="17s" repeatCount="indefinite"/></circle>
      <circle r="180" fill="#9b5cff" cx="820" cy="240"><animate attributeName="cx" values="820;980;820" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="240;70;240" dur="11s" repeatCount="indefinite"/></circle>
      <circle r="170" fill="#ff3fb4" cx="1080" cy="30"><animate attributeName="cx" values="1080;880;1080" dur="16s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="1200" height="280" fill="url(#grid)"/>

    <!-- player -->
    <rect x="340" y="50" width="520" height="160" rx="20" fill="#0d0718" fill-opacity=".6" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="362" y="72" width="116" height="116" rx="14" fill="#9b5cff" filter="url(#glow)" opacity=".6"><animate attributeName="opacity" values=".35;.8;.35" dur="3s" repeatCount="indefinite"/></rect>
    <g clip-path="url(#cover)">
      <rect x="360" y="70" width="120" height="120" fill="url(#four)"/>
      <circle cx="420" cy="130" r="38" fill="#0d0718" opacity=".55"/>
      <circle cx="420" cy="130" r="26" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
      <circle cx="420" cy="130" r="6" fill="#ffffff" opacity=".9"/>
      <rect x="360" y="70" width="120" height="120" fill="url(#four)" opacity=".18"><animateTransform attributeName="transform" type="rotate" from="0 420 130" to="360 420 130" dur="8s" repeatCount="indefinite"/></rect>
    </g>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="504" y="92" font-size="11" letter-spacing="3" fill="#c9b8ff" opacity=".85">TOCANDO AGORA</text>
      <text x="504" y="126" font-size="28" font-weight="700" fill="#ffffff">Lilacs</text>
      <text x="504" y="150" font-size="15" fill="#efe6ff" opacity=".75">Pastel Ghost</text>
      <text x="504" y="196" font-size="10" letter-spacing="1" fill="#ffffff" opacity=".5">1:12</text>
      <text x="836" y="196" font-size="10" letter-spacing="1" fill="#ffffff" opacity=".5" text-anchor="end">3:40</text>
    </g>
    <rect x="504" y="170" width="332" height="4" rx="2" fill="#ffffff" opacity=".14"/>
    <rect x="504" y="170" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;332" dur="24s" repeatCount="indefinite"/></rect>
    <circle cx="836" cy="74" r="4" fill="#2ff3e0"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
    <g fill="#2ff3e0" transform="translate(804 118)">
      <rect x="0" width="4" rx="2" y="10" height="10"><animate attributeName="height" values="4;22;4" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="18;0;18" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="8" width="4" rx="2" y="0" height="22"><animate attributeName="height" values="22;6;22" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="0;16;0" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="16" width="4" rx="2" y="6" height="16"><animate attributeName="height" values="8;22;8" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="14;0;14" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="24" width="4" rx="2" y="12" height="10"><animate attributeName="height" values="14;4;14" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="8;18;8" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <text x="600" y="250" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#c9b8ff" opacity=".7">obrigado pela visita  ✦  feito com código e Pastel Ghost no fone</text>
    <rect width="1200" height="280" fill="url(#scan)" opacity=".5"/>
    <rect width="1200" height="280" fill="url(#vig)"/>
  </g>
</svg>
